<h1>Tipos Lojas</h1>
<table class="tabela" mat-table [dataSource]="tipos">
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let tipo">{{ tipo.nome }}</td>
  </ng-container>

  <ng-container matColumnDef="descricao">
    <th mat-header-cell *matHeaderCellDef>Descrição</th>
    <td mat-cell *matCellDef="let tipo">{{ tipo.descricao }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      <div class="botao_acao_list">
        <button
          class="botao_acao"
          [routerLink]="['/tipo-loja', row.id, 'edicao']"
        >
          Edit
        </button>
        <button class="botao_acao" (click)="deactivateTipoLoja(row)">
          Del
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
  <tr mat-row *matRowDef="let item; columns: columnsToDisplay"></tr>
</table>

<button class="botao" mat-button [routerLink]="['/tipo-loja/criacao']">
  Criar tipo-loja
</button>
<button class="botao" mat-button [routerLink]="['/loja']">Voltar</button>
