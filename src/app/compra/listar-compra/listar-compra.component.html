<h1>Compras</h1>
<!-- ..'codigo', 'data', 'lojaNome', 'vaorTotal' -->
<table mat-table [dataSource]="compras">
  <ng-container matColumnDef="codigo">
    <th mat-header-cell *matHeaderCellDef>Codigo</th>
    <td mat-cell *matCellDef="let compra">{{ compra.codigo }}</td>
  </ng-container>

  <ng-container matColumnDef="dataCompra">
    <th mat-header-cell *matHeaderCellDef>Data Compra</th>
    <td mat-cell *matCellDef="let compra">{{ compra.dataCompra }}</td>
  </ng-container>

  <ng-container matColumnDef="lojaNome">
    <th mat-header-cell *matHeaderCellDef>Data Compra</th>
    <td mat-cell *matCellDef="let compra">{{ compra.lojaNome }}</td>
  </ng-container>

  <ng-container matColumnDef="valorTotal">
    <th mat-header-cell *matHeaderCellDef>Valor Total (R$)</th>
    <td mat-cell *matCellDef="let compra">{{ compra.valorTotal }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      <div class="botao_acao_list">
        <button mat-raised-button (click)="openPagamentoDialog(row)">
          Add pagamento
        </button>
        <button mat-raised-button>Add produto</button>
        <button mat-raised-button>Visualizar</button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
  <tr mat-row *matRowDef="let item; columns: columnsToDisplay"></tr>
</table>

<button class="botao" mat-button [routerLink]="['/']">Criar Compra</button>
<button class="botao" mat-button [routerLink]="['/']">Voltar</button>
