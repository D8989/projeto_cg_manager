<h1>Criação de Compra</h1>

<mat-form-field>
  <mat-label>Escolha a Loja</mat-label>
  <mat-select
    [formControl]="lojaSelectForm"
    (blur)="checkLojaSelectedForm()"
    required
  >
    <mat-option *ngFor="let l of lojas" [value]="l.id">{{ l.nome }}</mat-option>
  </mat-select>
  <mat-error *ngIf="lojaSelectForm.invalid">{{
    erroLojaSeletFormMsg
  }}</mat-error>
</mat-form-field>

<mat-form-field>
  <mat-label>Choose a date</mat-label>
  <input matInput [matDatepicker]="picker" [formControl]="dataForm" />
  <mat-hint>MM/DD/YYYY</mat-hint>
  <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
</mat-form-field>

<div>
  <button mat-button (click)="salvar()" [disabled]="isSalvarDissable()">
    Salvar
  </button>
  <br />
  <button class="botao" mat-button [routerLink]="['/compra']">Cancelar</button>
</div>
