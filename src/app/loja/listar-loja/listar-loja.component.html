<h1>Lojas</h1>
<table mat-table [dataSource]="lojas">
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let loja">{{ loja.nome }}</td>
  </ng-container>

  <ng-container matColumnDef="apelido">
    <th mat-header-cell *matHeaderCellDef>Apelido</th>
    <td mat-cell *matCellDef="let loja">{{ loja.apelido }}</td>
  </ng-container>

  <ng-container matColumnDef="tipo">
    <th mat-header-cell *matHeaderCellDef>Tipo</th>
    <td mat-cell *matCellDef="let loja">{{ loja.tipoLoja.nome }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      <div class="botao_acao_list">
        <button class="botao_acao" (click)="removerLoja(row)">Del</button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
  <tr mat-row *matRowDef="let item; columns: columnsToDisplay"></tr>
</table>

<div>
  <button class="botao" mat-button [routerLink]="['/loja/criacao']">
    Criar Loja
  </button>
  <button class="botao" mat-button [routerLink]="['/tipo-loja']">
    Tipos lojas
  </button>
  <button class="botao" mat-button [routerLink]="['/compra']">Voltar</button>
</div>
